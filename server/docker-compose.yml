services:
  nekomate:
    image: nekomate-server:1.9.32
    container_name: nekomate
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      NM_DATA_DIR: /data
      NM_PORT: "8080"
      NM_PUBLIC_BASE_URL: "http://127.0.0.1:8080"
      NM_ADMIN_USERNAME: admin
      NM_ADMIN_PASSWORD: change-me-now
      NM_REGISTRATION_ENABLED: "true"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('NM_PORT','8080')+'/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
